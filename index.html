<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b09; --panel: #17140f; --line: #2e2819;
    --gold: #d9aa3f; --gold-hi: #f1d58a; --text: #f3ede0; --muted: #b3a98f;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", "Noto Sans Ethiopic", "Abyssinica SIL", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.65; font-size: 16px; padding-bottom: 88px;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  section { padding: 48px 0; }
  h1, h2 { line-height: 1.15; letter-spacing: -0.01em; }
  h2 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800; color: var(--gold-hi); margin-bottom: 10px; }
  .lead { color: var(--muted); max-width: 58ch; margin-bottom: 24px; }
  :focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* top bar */
  .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; }
  .logo { font-weight: 800; font-size: 1.7rem; letter-spacing: -0.03em;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo small { display: block; font-size: .62rem; letter-spacing: .08em; font-weight: 600; -webkit-text-fill-color: var(--muted); color: var(--muted); }
  .lang { display: flex; border: 2px solid var(--gold); border-radius: 999px; overflow: hidden; }
  .lang button { background: none; border: 0; color: var(--gold-hi); font-weight: 800; font-size: .95rem; font-family: inherit; padding: 9px 16px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--gold); color: #1c1503; }

  /* hero */
  .hero { display: grid; gap: 20px; grid-template-areas: "text" "stage" "cta"; padding-bottom: 28px; }
  .hero-text { grid-area: text; }
  .hero h1 { font-size: clamp(2.2rem, 9vw, 4.2rem); font-weight: 800; }
  .hero p { color: var(--muted); max-width: 44ch; margin-top: 12px; font-size: 1.02rem; }
  .stage-box { grid-area: stage; perspective: 900px; }
  .stage { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; } .card { transition: none !important; } }

  /* drag-to-turn pack: a flat card with a front face (photo or video) and a back face (facts) */
  .card { position: relative; width: min(100%, 520px); height: 46vh; max-height: 440px; margin: 0 auto;
    transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.8,.2,1);
    cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .card.drag { transition: none; cursor: grabbing; }
  .face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .media { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 68% 66% at 50% 50%, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 68% 66% at 50% 50%, #000 62%, transparent 100%); }
  .back { transform: rotateY(180deg); display: flex; flex-direction: column; justify-content: center; gap: 10px;
    padding: 16px 18px; border: 2px solid var(--gold); border-radius: 22px; overflow: hidden;
    background: linear-gradient(160deg, #1d1810, #0c0b09); font-size: .88rem; line-height: 1.45; }
  .back .logo { font-size: 1.5rem; }
  .back ul { list-style: none; display: grid; gap: 6px; }
  .back li { border-left: 3px solid var(--gold); padding: 4px 10px; font-weight: 600; }
  .back .nums { color: var(--gold-hi); font-weight: 800; }
  .turn { display: block; margin: 8px auto 0; background: none; border: 0; color: var(--muted); font-weight: 600; font-size: .9rem; font-family: inherit; cursor: pointer; padding: 6px 10px; }

  .cta { grid-area: cta; display: grid; gap: 14px; align-content: start; }
  .badge { display: inline-block; justify-self: start; background: var(--panel); border: 1px solid var(--gold); color: var(--gold-hi); font-weight: 800; font-size: .92rem; padding: 7px 14px; border-radius: 999px; }
  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick { background: var(--bg); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; font-family: inherit; display: grid; gap: 2px; }
  .pick b { font-size: 1.05rem; }
  .pick span { color: var(--gold-hi); font-weight: 800; }
  .pick[aria-pressed="true"] { border-color: var(--gold); background: var(--panel); }
  .btn { display: inline-block; background: var(--gold); color: #1c1503; border: 0; border-radius: 999px; cursor: pointer; text-align: center;
    font-weight: 800; font-size: 1rem; font-family: "Montserrat", system-ui, "Noto Sans Ethiopic", sans-serif; padding: 15px 26px; text-decoration: none; }
  .btn:hover { background: var(--gold-hi); }
  .btn.ghost { background: transparent; color: var(--gold-hi); border: 2px solid var(--gold); padding: 13px 24px; }
  .btn.ghost:hover { background: var(--panel); }
  .btns { display: grid; gap: 10px; }
  @media (min-width: 820px) {
    .hero { grid-template-columns: 1.05fr 1fr; grid-template-areas: "text stage" "cta stage"; align-items: center; column-gap: 40px; }
    .btns { grid-template-columns: auto auto; justify-content: start; }
    .card { height: auto; max-height: none; aspect-ratio: 500 / 495; }
  }

  /* features */
  .features { list-style: none; display: grid; gap: 12px; }
  .features li { border-left: 3px solid var(--gold); background: var(--panel); padding: 14px 16px; border-radius: 0 var(--radius) var(--radius) 0; font-weight: 600; }
  @media (min-width: 640px) { .features { grid-template-columns: 1fr 1fr; } }

  /* natural ingredients band (looping seeds clip behind the text) */
  .natural { position: relative; border-radius: var(--radius); overflow: hidden; min-height: 210px; display: grid; align-items: end; background: var(--panel); }
  .natural video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .natural::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(12,11,9,.88) 0%, rgba(12,11,9,.35) 60%, rgba(12,11,9,.1) 100%); }
  .natural-text { position: relative; z-index: 1; padding: 20px; }
  .natural-text h2 { margin-bottom: 4px; }
  .natural-text p { color: var(--text); font-weight: 600; }

  /* steps */
  ol.steps { list-style: none; counter-reset: s; display: grid; gap: 16px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
  ol.steps li::before { content: counter(s); width: 40px; height: 40px; border-radius: 50%; background: var(--gold); color: #1c1503; display: grid; place-items: center; font-weight: 800; }

  /* trust (shown only when real content is added) */
  .quotes { display: grid; gap: 12px; }
  blockquote { background: var(--panel); border-left: 3px solid var(--gold); padding: 14px 16px; border-radius: 0 var(--radius) var(--radius) 0; }
  blockquote cite { display: block; margin-top: 6px; color: var(--muted); font-style: normal; font-size: .9rem; }
  .fresh { margin-top: 14px; color: var(--muted); }

  /* order form (short) */
  .order { background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  form { display: grid; gap: 20px; max-width: 520px; }
  fieldset { border: 0; display: grid; gap: 10px; }
  legend, .lbl { font-weight: 800; margin-bottom: 8px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .opt { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: var(--bg); white-space: nowrap; }
  .opt.on { border-color: var(--gold); }
  .opt input { accent-color: var(--gold); width: 18px; height: 18px; }
  .opt .price { margin-left: auto; color: var(--gold-hi); font-weight: 800; }
  label.field { display: grid; gap: 6px; font-weight: 800; }
  input[type=text], input[type=tel] { font: inherit; font-weight: 600; padding: 13px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--text); }
  .qty { display: flex; align-items: center; gap: 14px; }
  .qty button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--gold); color: #1c1503; font-size: 1.4rem; font-weight: 800; cursor: pointer; }
  .qty output { min-width: 34px; text-align: center; font-size: 1.3rem; font-weight: 800; }
  .total { font-size: 1.05rem; }
  .total b { font-size: 1.7rem; color: var(--gold-hi); }
  .fee { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .error { color: #ff9a8a; font-weight: 800; min-height: 1.4em; }

  details { border-bottom: 1px solid var(--line); padding: 16px 0; }
  summary { cursor: pointer; font-weight: 800; }
  details p { color: var(--muted); margin-top: 10px; max-width: 60ch; }

  .contact-btns { display: flex; flex-wrap: wrap; gap: 12px; }
  footer { padding: 24px 0 28px; text-align: center; color: var(--muted); font-size: .9rem; }

  /* sticky bottom bar on phones, floating WhatsApp button on larger screens */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 10px; align-items: center;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(12,11,9,.95); border-top: 1px solid var(--line); }
  .dock .btn { flex: 1; }
  .dock.hide-order .btn { display: none; }
  .dock.hide-order { background: none; border: 0; justify-content: flex-end; pointer-events: none; }
  .dock.hide-order .wa { pointer-events: auto; }
  .wa { flex: none; width: 54px; height: 54px; border-radius: 50%; background: #25d366; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .wa svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (min-width: 820px) {
    body { padding-bottom: 0; }
    .dock { left: auto; background: none; border: 0; padding: 20px; pointer-events: none; }
    .dock .btn { display: none; }
    .dock .wa { pointer-events: auto; }
  }
</style>
</head>

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("en-US");

let lang = SHOP.defaultLang === "en" ? "en" : "am";
let sizeId = SHOP.sizes[0].id;
let qty = 1;
const t = (k) => T[lang][k];
const sizeObj = () => SHOP.sizes.find((s) => s.id === sizeId);
const waLink = (text) => "https://wa.me/" + SHOP.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "");

/* ---------- build everything that depends on language or size ---------- */
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  // size picks in the hero and size cards in the form
  $("picks").innerHTML = SHOP.sizes.map((s) =>
    '<button type="button" class="pick" data-size="' + s.id + '" aria-pressed="' + (s.id === sizeId) + '"><b>' + s.label +
    "</b><span>" + fmt(s.price) + " " + t("currency") + "</span></button>").join("");
  $("sizes").innerHTML = SHOP.sizes.map((s) =>
    '<label class="opt' + (s.id === sizeId ? " on" : "") + '"><input type="radio" name="size" value="' + s.id + '"' + (s.id === sizeId ? " checked" : "") +
    "><span>" + s.label + '</span><span class="price">' + fmt(s.price) + " " + t("currency") + "</span></label>").join("");

  // quick order button (opens WhatsApp with the chosen pack)
  const s = sizeObj();
  $("quickBtn").textContent = lang === "en" ? "Order " + s.label + " on WhatsApp" : s.label + " በዋትስአፕ ይዘዙ";
  $("quickBtn").href = waLink("Hello Anubix! I want to order: Home Made Protein " + s.label + " x 1. Total: " + fmt(s.price) + " ETB. Please confirm delivery and payment.");

  // bottom bar
  const min = Math.min.apply(null, SHOP.sizes.map((x) => x.price));
  $("dockOrder").textContent = t("dockOrder") + " " + fmt(min) + " " + t("currency");
  $("dockWa").href = waLink("Hello Anubix!");

  // back of the pack
  $("backPhones").textContent = SHOP.phones.map((x) => x.label).join("   ");

  // trust section: only when there is real content
  const hasQuotes = SHOP.testimonials.length > 0;
  const hasBatch = SHOP.batch.produced || SHOP.batch.bestBefore;
  $("trust").hidden = !(hasQuotes || hasBatch);
  $("quotes").innerHTML = "";
  SHOP.testimonials.forEach((q) => {
    const b = document.createElement("blockquote");
    b.innerHTML = "<p></p><cite></cite>";
    b.children[0].textContent = q[lang] || q.en;
    b.children[1].textContent = q.name;
    $("quotes").appendChild(b);
  });
  $("fresh").textContent = hasBatch
    ? [SHOP.batch.produced && t("produced") + ": " + SHOP.batch.produced, SHOP.batch.bestBefore && t("bestBefore") + ": " + SHOP.batch.bestBefore].filter(Boolean).join("   ")
    : "";

  // contact
  let html = '<a class="btn" href="' + waLink("") + '" target="_blank" rel="noopener">' + t("whatsappBtn") + "</a>";
  if (SHOP.telegram) html += '<a class="btn ghost" href="https://t.me/' + SHOP.telegram + '" target="_blank" rel="noopener">Telegram</a>';
  if (SHOP.tiktok) html += '<a class="btn ghost" href="https://www.tiktok.com/@' + SHOP.tiktok + '" target="_blank" rel="noopener">TikTok</a>';
  SHOP.phones.forEach((p) => { html += '<a class="btn ghost" href="tel:' + p.tel + '">' + t("callWord") + " " + p.label + "</a>"; });
  $("contactBtns").innerHTML = html;
  $("foot").textContent = "\u00A9 " + new Date().getFullYear() + " Anubix. " + t("footer");

  refresh();
}
function refresh() {
  $("qty").textContent = qty;
  $("total").textContent = fmt(sizeObj().price * qty) + " " + t("currency");
}

/* ---------- interactions ---------- */
$("picks").addEventListener("click", (e) => {
  const b = e.target.closest(".pick");
  if (b) { sizeId = b.dataset.size; render(); }
});
$("orderForm").addEventListener("change", (e) => {
  if (e.target.name === "size") { sizeId = e.target.value; render(); }
});
$("minus").onclick = () => { if (qty > 1) { qty--; refresh(); } };
$("plus").onclick = () => { if (qty < 50) { qty++; refresh(); } };
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; render(); }));

$("orderForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("cName").value.trim(), phone = $("cPhone").value.trim(), area = $("cArea").value.trim();
  if (!name || !phone || !area) { $("err").textContent = t("err"); return; }
  $("err").textContent = "";
  const s = sizeObj();
  const lines = [
    "New order: Anubix Home Made Protein",
    "Pack: " + s.label + " x " + qty,
    "Total: " + fmt(s.price * qty) + " ETB",
    "Name: " + name,
    "Phone: " + phone,
    "Area: " + area,
    "Please confirm delivery and payment."
  ];
  window.open(waLink(lines.join("\n")), "_blank");
});

/* ---------- the bottom bar hides its Order button while the form is on screen ---------- */
if ("IntersectionObserver" in window) {
  new IntersectionObserver((entries) => {
    $("dock").classList.toggle("hide-order", entries[0].isIntersecting);
  }).observe($("order"));
}

/* ---------- people who ask their phone for less motion get a still image instead of the looping clip ---------- */
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const sv = $("seedVid");
  sv.removeAttribute("autoplay"); sv.pause();
}

/* ---------- hero: real video if provided, then drag or tap to turn the pack ---------- */
(function () {
  const card = $("card"), btn = $("turnBtn");
  if (SHOP.video) {
    const img = $("heroImg");
    const v = document.createElement("video");
    v.className = "media";
    v.src = SHOP.video; v.poster = img.src;
    v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.preload = "metadata";
    v.setAttribute("aria-label", img.alt);
    img.replaceWith(v);
  }
  let angle = 0, startX = 0, startAngle = 0, down = false, moved = 0;
  const apply = () => { card.style.transform = "rotateY(" + angle + "deg)"; };
  const norm = () => ((angle % 360) + 360) % 360;
  // jump to an equivalent angle with no animation (avoids a long spin), then animate to the target
  function goTo(target) {
    card.classList.add("drag"); angle = norm(); apply(); void card.offsetWidth;
    card.classList.remove("drag"); angle = target; apply();
  }
  function snap() { const a = norm(); goTo(a < 90 ? 0 : a < 270 ? 180 : 360); }
  function flip() { const a = norm(); goTo(a < 90 || a >= 270 ? 180 : 0); }
  card.addEventListener("transitionend", () => {
    if (angle === 360) { card.classList.add("drag"); angle = 0; apply(); void card.offsetWidth; card.classList.remove("drag"); }
  });
  card.addEventListener("pointerdown", (e) => {
    down = true; moved = 0; startX = e.clientX; startAngle = angle;
    card.classList.add("drag"); card.setPointerCapture(e.pointerId);
  });
  card.addEventListener("pointermove", (e) => {
    if (!down) return;
    const dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    angle = startAngle + dx * 0.6; apply();
  });
  const end = () => { if (!down) return; down = false; if (moved < 6) { angle = startAngle; flip(); } else snap(); };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  btn.addEventListener("click", flip);
})();

render();
</script>
